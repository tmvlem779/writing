# Hosted settings are deliberately kept minimal. `supabase config push` changes
# only properties declared here, avoiding accidental overwrites from CLI defaults.
project_id = "writing"

[auth]
site_url = "https://writing-suhyeon3.vercel.app"
additional_redirect_urls = [
  "http://localhost:3000/auth/confirm",
  "https://writing-suhyeon3.vercel.app/auth/confirm",
  "https://*-suhyeon3.vercel.app/auth/confirm",
]
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[auth.sms]
enable_signup = false
enable_confirmations = false
