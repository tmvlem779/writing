# Hosted settings are deliberately kept minimal. `supabase config push` changes
# only properties declared here, avoiding accidental overwrites from CLI defaults.
project_id = "writing"

[auth]
site_url = "https://writing-suhyeon3.vercel.app"
additional_redirect_urls = [
  "http://localhost:3000/auth/confirm",
  "https://writing-suhyeon3.vercel.app/auth/confirm",
  "https://*-suhyeon3.vercel.app/auth/confirm",
]
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.email]
# 학교 아이디는 내부 전용 이메일 식별자로 변환해 로그인한다. 공개 가입은
# 위의 auth.enable_signup=false가 차단하므로 이메일 공급자는 활성 상태여야 한다.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[auth.sms]
enable_signup = false
enable_confirmations = false
